  aurora_cover: [极光封面, 科技封面]
  aurora_mix_panel: [极光面板, 信息面板]

# --- deck 结构：自然语言 → slide_structure ---
structure_aliases:
  enterprise_report_12: [企业汇报, 完整汇报, 课题汇报, 12页, 正式汇报]
  compact_report_6: [精简汇报, 快速汇报, 6页, 短汇报]
  storyboard: [分镜, 视频分镜, 内容展示, 叙事, 短视频]

# --- 产物类型：自然语言 → mode ---
mode_aliases:
  page: [单页, 一页, 做一页, 一张图, 封面图]
  deck: [演示文稿, 幻灯片, PPT, 多页, 分镜, slide, deck, 视频]

# --- 导出意图 ---
export_aliases:
  enable_png: [导出PNG, 导出图片, 分镜图, 视频帧, 截图, 出图, 1920]

recommendations:
  default_layout_by_style:
    weekly_report_mflex: weekly_report_2x2
    dark_gold_insight: dark_gold_three_col
    raw_paper_notes: raw_paper_storyboard
    social_card_layering_v2a: social_cover_v2a
    social_dashboard_v2b: social_dashboard_v2b
    aurora_ui: aurora_cover
  default_structure: compact_report_6
  default_deck_theme: purple-gold-presentation
  # deck 主题按 scheme 快速分流
  theme_by_scheme:
    light: [blockframe, blue-professional]
    dark: [blockframe-dark, purple-gold-presentation]
