version: "3.0"
# 自然语言 → 标准 ID。page 用 style_id，deck 用 theme_id。

# --- page 视觉风格：自然语言 → style_id ---
style_aliases:
  weekly_report_mflex: [MFLEX, mflex, 蓝白汇报, 企业蓝白, 项目汇报, 工作汇报, 周报, PPT蓝白]
  dark_gold_insight: [暗金, 黑金, 夜读, 数据洞察, 深色笔记, editorial]
  raw_paper_notes: [Raw Paper, raw paper, 文本类, 纸感, 草稿, 扫描稿, Anti-Polish]
  social_card_layering_v2a: [自媒体封面, V2a, 层叠卡片, Dimensional Layering, 蓝紫橙]
  social_dashboard_v2b: [仪表盘, 数据看板, V2b, 项目看板, 橙色指标]
  aurora_ui: [Aurora, Aurora UI, 极光, 科技风, 玻璃拟态, AI工具]

# --- deck 视觉主题：自然语言 → theme_id ---
