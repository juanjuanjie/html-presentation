  blockframe-dark: [暗色粗野, 黑底粗野, 荧光粗野, BlockFrame Dark, 暗色分镜]
  blue-professional: [蓝professional, 商务蓝, 咨询风, 奶油蓝, 专业风, Blue Professional, 钴蓝]
  purple-gold-presentation: [紫金, 紫金演示, 黑紫, 暗色电影感, 教程暗色, Purple Gold, 默认演示, 苹果风, Notion风]

# --- page 版式：自然语言 → layout_id ---
layout_aliases:
  weekly_report_2x2: [四象限, 四块, 2x2, 周报四象限]
  weekly_report_lr: [左右, 双栏, 左摘要右明细]
  dark_gold_three_col: [三栏, 三列, 洞察三栏]
  raw_paper_storyboard: [故事板, 纸张面板, 拼贴]
  social_cover_v2a: [封面, 左文右图, 左文右面板]
